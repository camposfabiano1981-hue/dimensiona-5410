<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dimensiona 5410</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: prancha técnica — carimbo no topo, abas fixas, bancada em duas colunas (lista de circuitos | editor com resultado) */
:root{
  --paper:#EDF1F3; --sheet:#FFFFFF; --sunk:#F5F7F8; --ink:#16212A; --muted:#5A6873; --line:#CBD4DA; --line-strong:#97A6B1;
  --accent:#0B6A84; --accent-ink:#FFFFFF; --accent-soft:#DDEEF3;
  --ok:#1F7446; --ok-soft:#E0F1E7; --warn:#8F5E00; --warn-soft:#FAEFD7; --fail:#B42318; --fail-soft:#FBE4E1;
  --copper:#B5652C;
  --c-fase-a:#232323; --c-fase-b:#C62828; --c-fase-c:#F3F3F1; --c-neutro:#5FA8E6; --c-pe:#2E9D4F; --c-pe2:#F2C500; --c-capa:#6E7880;
  --doc-bg:#FFFFFF; --doc-ink:#1B1F23; --doc-muted:#56606A; --doc-line:#B9C3CB; --doc-head:#E7EDF1; --doc-eq:#F2F5F7; --doc-accent:#0B5A70; --doc-ok:#1F6E43; --doc-fail:#A8231A; --doc-warn:#8A5A00;
  --f-display:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1419; --sheet:#141E25; --sunk:#10181E; --ink:#E3EBF0; --muted:#97A6B1; --line:#283640; --line-strong:#425361;
  --accent:#4DB3CF; --accent-ink:#04212A; --accent-soft:#12313B;
  --ok:#5CC98A; --ok-soft:#10301E; --warn:#E3B04B; --warn-soft:#33270C; --fail:#F2786B; --fail-soft:#3A1613; --copper:#D98B52; --c-capa:#8E99A1;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1419; --sheet:#141E25; --sunk:#10181E; --ink:#E3EBF0; --muted:#97A6B1; --line:#283640; --line-strong:#425361;
  --accent:#4DB3CF; --accent-ink:#04212A; --accent-soft:#12313B;
  --ok:#5CC98A; --ok-soft:#10301E; --warn:#E3B04B; --warn-soft:#33270C; --fail:#F2786B; --fail-soft:#3A1613; --copper:#D98B52; --c-capa:#8E99A1;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 56px}
.num{font-variant-numeric:tabular-nums}

/* topo */
.topo{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:stretch;justify-content:space-between;margin-bottom:12px}
.marca{display:flex;gap:12px;align-items:center;min-width:0}
.marca svg{flex:none}
.marca h1{font:700 26px/1 var(--f-display);letter-spacing:.01em;margin:0;text-transform:uppercase}
.marca h1 b{color:var(--accent);font-weight:700}
.marca p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.carimbo{display:grid;grid-template-columns:repeat(4,minmax(0,auto));border:1px solid var(--line-strong);background:var(--sheet);min-width:0;flex:1 1 420px;max-width:720px}
.carimbo div{padding:5px 10px;border-left:1px solid var(--line);min-width:0}
.carimbo div:first-child{border-left:0}
.carimbo small{display:block;font:600 10px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.carimbo span{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 12px;border:1px solid var(--line-strong);background:var(--sheet);border-radius:var(--r);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.perigo{border-color:var(--fail);color:var(--fail)}
.btn.sm{min-height:28px;padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;border:1px dashed var(--line-strong);background:var(--sunk);padding:8px 12px;margin-bottom:12px;font-size:13px}

/* abas */
.abas{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;flex-wrap:wrap;gap:0 2px;border-bottom:1px solid var(--line-strong);margin-bottom:18px}
.abas button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 8px;cursor:pointer;font:600 15px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.abas button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.abas button:hover{color:var(--ink)}
.abas .cnt{font:500 11px var(--f-mono);margin-left:6px;padding:1px 5px;border-radius:3px;background:var(--line);color:var(--ink);vertical-align:1px}
.abas .cnt.fail{background:var(--fail);color:var(--sheet)}

/* painéis */
h2.tit{font:700 20px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;max-width:75ch}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 14px}
.grade.g3{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
fieldset{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:12px 14px 14px;margin:0 0 14px;min-width:0}
legend{font:700 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:0 6px}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo label,.campo .lbl{font-size:12px;font-weight:500;color:var(--muted)}
.campo.wide{grid-column:1/-1}
.campo.w2{grid-column:span 2}
input[type=text],input[type=date],select,textarea{width:100%;min-height:34px;padding:6px 9px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--sheet)}
input[type=text].numin{font-family:var(--f-mono);font-size:13px}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.unid{display:flex;min-width:0}
.unid input{border-top-right-radius:0;border-bottom-right-radius:0;min-width:0}
.unid select,.unid em{width:auto;flex:none;border-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.unid em{font-style:normal;display:flex;align-items:center;padding:0 9px;border:1px solid var(--line-strong);border-left:0;border-radius:0 var(--r) var(--r) 0;background:var(--sunk);color:var(--muted);font-size:12px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer;padding-top:4px}
.chk input{margin:3px 0 0;accent-color:var(--accent)}
.dica{font-size:11.5px;color:var(--muted)}

/* bancada de circuitos */
.bancada{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
.lista{position:sticky;top:56px;max-height:calc(100vh - 80px);display:flex;flex-direction:column;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);min-width:0}
.lista-topo{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.lista-itens{overflow:auto;padding:4px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:var(--r);padding:8px 8px;cursor:pointer}
.item:hover{background:var(--sunk)}
.item[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.item .n{font:700 14px/1.2 var(--f-display);min-width:34px}
.grupo{padding:8px 8px 2px;font:600 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.met-bloco{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:start}
.met-fig{margin:0;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);padding:6px}
.met-fig svg{width:100%;height:auto;display:block}
.met-fig figcaption{font-size:11.5px;color:var(--muted);text-align:center;margin-top:4px}
.tbl.t33 td{vertical-align:middle;white-space:normal}
.tbl.t33 td:nth-child(2){width:166px;min-width:166px}
.t33 .t33-fig{display:block;width:150px}
.t33 .t33-fig svg{width:150px;height:auto;display:block}
.t33 .t33-desc{display:block;min-width:200px;max-width:440px}
.item .d{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .e{grid-column:2/4;font:12px/1.3 var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-right:4px}
.dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--line-strong)}
.dot.A{background:var(--c-fase-a)}.dot.B{background:var(--c-fase-b)}.dot.C{background:var(--c-fase-c)}
.pill{display:inline-flex;align-items:center;gap:4px;font:700 10.5px/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;padding:4px 7px;border-radius:3px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.fail{background:var(--fail-soft);color:var(--fail)}
.editor{min-width:0}
.ed-topo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}

/* resultado */
.res{border:1px solid var(--line-strong);background:var(--sheet);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.res-cab{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--sunk)}
.res-cab h3{margin:0;font:700 17px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.03em;min-width:0}
.spec{padding:12px 14px 4px;display:grid;gap:6px}
.spec .linha{display:flex;flex-wrap:wrap;gap:6px 18px}
.spec .linha > span{display:flex;gap:6px;align-items:baseline;min-width:0}
.spec small{font:600 10.5px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.spec b{font-weight:600}
.metr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;border-top:1px solid var(--line);margin-top:10px}
.metr div{padding:8px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.metr small{display:block;font:600 10.5px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.metr span{font:500 15px/1.3 var(--f-mono);white-space:nowrap}
.metr span.bad{color:var(--fail)}
.crit{width:100%;border-collapse:collapse;font-size:13px}
.crit td,.crit th{padding:6px 14px;border-bottom:1px solid var(--line);text-align:left}
.crit th{font:600 10.5px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.crit td.s{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.crit tr.gov td{font-weight:600;background:var(--accent-soft)}
.msgs{list-style:none;margin:0;padding:8px 14px 12px;display:grid;gap:6px;font-size:13px}
.msgs li{padding:6px 10px;border-radius:3px}
.msgs li.fail{background:var(--fail-soft);color:var(--fail)}.msgs li.warn{background:var(--warn-soft);color:var(--warn)}

/* tabelas genéricas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th{font:600 11px/1.2 var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;background:var(--sunk);position:sticky;top:0}
.tbl th,.tbl td{padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.r,.tbl th.r{text-align:right}
.tbl.nt th{text-transform:none;letter-spacing:.02em;font-size:12px}
.tbl td.wrap{white-space:normal;min-width:180px}
.tbl tr.tot td{font-weight:600;background:var(--sunk)}
.tbl tbody tr.clic{cursor:pointer}.tbl tbody tr.clic:hover td{background:var(--accent-soft)}
.tbl input{min-height:26px;padding:2px 6px;width:72px;font-family:var(--f-mono);font-size:12px}

/* eletrodutos */
.trechos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:16px}
.trecho{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);min-width:0}
.trecho-cab{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.trecho-cab h3{margin:0;font:700 16px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.trecho-corpo{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;padding:12px 14px}
.corte{display:flex;flex-direction:column;align-items:center;gap:6px}
.corte svg{width:100%;max-width:170px;height:auto}
.corte .leg{font:12px var(--f-mono);text-align:center}
.trecho .grade{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px 10px;padding:0 14px 14px}
.mini{font-size:12px;color:var(--muted)}
.trecho-corpo.calha{grid-template-columns:minmax(0,220px) minmax(0,1fr)}
.corte.larga svg{max-width:220px;max-height:170px}
.trecho-corpo .tbl td{white-space:normal}.trecho-corpo .tbl td.r{min-width:70px}
.tbl td.ok{color:var(--ok);font-weight:600}.tbl td.bad{color:var(--fail);font-weight:600}

/* luminotécnica */
.planta{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.planta svg{width:100%;height:auto;max-height:420px;display:block}
.planta .leg{font-size:12px;display:grid;gap:6px}
.escala{height:10px;border:1px solid var(--line);border-radius:2px;background:linear-gradient(90deg,#2c3e94,#1f8fbf,#3cb371,#e8d23a,#e8762c,#c8302c)}
.verif{list-style:none;margin:0;padding:8px 14px 12px;display:grid;gap:6px;font-size:13px}
.verif li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px}
.verif li b{font-family:var(--f-mono)}
.verif li.ok::before{content:"✓";color:var(--ok);font-weight:700}.verif li.fail::before{content:"✗";color:var(--fail);font-weight:700}.verif li.info::before{content:"i";color:var(--muted);font:italic 700 13px Georgia,serif;text-align:center}

/* quadros */
.quadro{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);margin-bottom:18px;min-width:0}
.quadro-cab{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.quadro-cab h3{margin:0;font:700 18px/1.2 var(--f-display);text-transform:uppercase}
.quadro .tw{border:0;border-radius:0}
.balanco{display:grid;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.bar{display:grid;grid-template-columns:60px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:12.5px}
.bar .trilho{height:14px;background:var(--sunk);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar .enc{height:100%;background:var(--accent)}
.bar .v{font-family:var(--f-mono);text-align:right}
.demanda{display:flex;flex-wrap:wrap;gap:6px 22px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.demanda b{font-family:var(--f-mono);font-weight:500}

/* memória */
.mem-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.mem-opc{display:flex;flex-wrap:wrap;gap:4px 16px}
.mem-bt{display:flex;flex-wrap:wrap;gap:8px}
.mem-lista{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);margin-bottom:12px}
.mem-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.mem-item:first-child{border-top:0}
.mem-item.on{background:var(--accent-soft)}
.mem-item.vazio{opacity:.55}
.mem-item .chk{padding:0}
.mem-nome{background:none;border:0;padding:2px 0;text-align:left;cursor:pointer;display:grid;gap:1px;min-width:0}
.mem-nome:disabled{cursor:default}
.mem-nome b{font-weight:600;font-size:13.5px}
.mem-nome span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.mem-nome:hover:not(:disabled) b{color:var(--accent)}
.mem-exp{display:flex;gap:4px}
.mem-cons{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--sunk);padding:10px 12px;margin-bottom:12px}
.folha{background:var(--doc-bg);color:var(--doc-ink);max-width:840px;margin:0 auto;padding:44px 52px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.aviso-prev{max-width:840px;margin:0 auto 10px;font-size:12px;color:var(--muted)}

/* tabelas da norma */
.ref-sel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ref-sel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ref-nota{font-size:12.5px;color:var(--muted);max-width:90ch;margin:10px 0 18px}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:var(--r);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:min(92vw,560px)}
#toast.on{opacity:1}

@media (max-width:1100px){.carimbo{grid-template-columns:repeat(2,minmax(0,1fr))}.carimbo div:nth-child(3){border-left:0}.carimbo div:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:900px){.bancada{grid-template-columns:minmax(0,1fr)}.lista{position:static;max-height:340px}}
@media (max-width:700px){.met-bloco{grid-template-columns:minmax(0,1fr)}.met-fig{max-width:260px}}
@media (max-width:700px){.planta{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.trecho-corpo.calha{grid-template-columns:minmax(0,1fr)}.folha{padding:22px 16px}.trecho-corpo{grid-template-columns:minmax(0,1fr)}.campo.w2{grid-column:auto}.abas button{padding:9px 9px 7px;font-size:13.5px}.marca h1{font-size:22px}.bar{grid-template-columns:44px minmax(0,1fr) 92px}.mem-item{grid-template-columns:auto minmax(0,1fr) auto}.mem-exp{grid-column:2/4}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="topo">
    <div class="marca">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
        <circle cx="23" cy="23" r="21" fill="none" stroke="var(--ink)" stroke-width="2.5"/>

        else t.falhas.push(`Trecho de ${nfmt(t.cfg.comp, 1)} m excede o limite de ${nfmt(t.Lim, 1)} m (${base} m ${t.cfg.local === 'externo' ? 'em área externa' : 'em área interna'} − 3 m por curva) — instalar caixa de passagem (6.2.11.1).`);
      }

}

/* ============== QUADROS E BALANCEAMENTO ============== */
function cargaFases(c, r) {
  const S = r.S || 0, f = (c.fases || '').split('').slice(0, nFases(c.ligacao)); const o = { A: 0, B: 0, C: 0 };
  f.forEach(l => { if (o[l] != null) o[l] += S / f.length; }); return o;
}
function calcQuadros(proj, res, demandaQD) {
  const nomes = new Set(Object.keys(proj.quadros || {})); proj.circuitos.forEach(c => nomes.add(c.quadro));
  const out = {};
  [...nomes].forEach(q => {
    const cs = proj.circuitos.filter(c => c.quadro === q);
    const fases = { A: 0, B: 0, C: 0 };
    cs.forEach(c => { const f = cargaFases(c, res[c.id]); fases.A += f.A; fases.B += f.B; fases.C += f.C; });
    const usadas = { monofasico: ['A'], bifasico: ['A', 'B'], trifasico: ['A', 'B', 'C'] }[proj.params.fornecimento] || ['A', 'B', 'C'];
    const vals = usadas.map(l => fases[l]); const mx = Math.max(...vals), mn = Math.min(...vals);
    out[q] = { q, cs, fases, usadas, deseq: mx > 0 && usadas.length > 1 ? (mx - mn) / mx * 100 : 0, dem: demandaQD(q), alim: proj.circuitos.find(c => c.tipo === 'dist' && c.alimenta === q) || null };
  });

}
function balancearFases(proj, calc, q) {
  const usadas = { monofasico: ['A'], bifasico: ['A', 'B'], trifasico: ['A', 'B', 'C'] }[proj.params.fornecimento];
  const cs = proj.circuitos.filter(c => c.quadro === q); const load = { A: 0, B: 0, C: 0 };
  cs.filter(c => nFases(c.ligacao) === 3).forEach(c => { const f = cargaFases(c, calc.res[c.id]); usadas.forEach(l => load[l] += f[l]); });
  const mov = cs.filter(c => nFases(c.ligacao) < 3).sort((a, b) => (calc.res[b.id].S || 0) - (calc.res[a.id].S || 0));
  const pares = usadas.length === 3 ? ['AB', 'BC', 'CA'] : (usadas.length === 2 ? ['AB'] : []);
  mov.forEach(c => {
    const S = calc.res[c.id].S || 0;
    if (nFases(c.ligacao) === 1) { const l = usadas.slice().sort((a, b) => load[a] - load[b])[0]; c.fases = l; load[l] += S; }
    else if (pares.length) {
      let best = pares[0], bestMax = Infinity;
      pares.forEach(p => { const t = { ...load }; p.split('').forEach(l => t[l] += S / 2); const m = Math.max(...usadas.map(l => t[l])); if (m < bestMax - 1e-9) { bestMax = m; best = p; } });
      c.fases = best; best.split('').forEach(l => load[l] += S / 2);
    }
  });
}

/* Corte esquemático da eletrocalha: cabos em linhas a partir do fundo */
function corteCalhaSVG(t, P = PAL_UI, pre = 'cc') {

  const pos = []; let x = 0, y = H, linha = 0;
  itens.forEach(k => { if (x + 2 * k.r > W + 1e-6) { y -= 2 * linha; x = 0; linha = 0; } pos.push({ k, cx: x + k.r, cy: y - k.r }); x += 2 * k.r; linha = Math.max(linha, k.r); });

  const sw = Math.max(0.4, W / 300);
  const perfil = t.T.aberta && t.cfg.tipo === 'leito' ? `<rect x="${m - 3}" y="${m}" width="3" height="${H}" fill="${P.ln}"/><rect x="${m + W}" y="${m}" width="3" height="${H}" fill="${P.ln}"/><line x1="${m}" y1="${m + H + 1.5}" x2="${m + W}" y2="${m + H + 1.5}" stroke="${P.ln}" stroke-width="3"/>`
    : `<path d="M${m} ${m} V${m + H} H${m + W} V${m}" fill="${P.face}" stroke="${P.ln}" stroke-width="${2 * sw}" ${t.T.aberta && t.cfg.tipo !== 'bandeja' ? `stroke-dasharray="${W / 30} ${W / 60}"` : ''}/>${!t.T.aberta ? `<line x1="${m - 2}" y1="${m}" x2="${m + W + 2}" y2="${m}" stroke="${P.ln}" stroke-width="${3 * sw}"/>` : ''}`;
  const cab = pos.map(({ k, cx, cy }) => {
    const X = m + cx, Y = m + cy;
    if (k.multipolar) return `<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="${k.r.toFixed(1)}" fill="var(--c-capa)" stroke="${P.ln}" stroke-width="${sw}"/>` + k.cond.map((q, j) => { const a = -Math.PI / 2 + j * 2 * Math.PI / k.vias; const xx = X + k.r * 0.45 * Math.cos(a), yy = Y + k.r * 0.45 * Math.sin(a); return `<circle cx="${xx.toFixed(1)}" cy="${yy.toFixed(1)}" r="${(k.r * 0.33).toFixed(1)}" fill="${cor(q)}" stroke="${P.ln}" stroke-width="${sw / 2}"/>`; }).join('');
    return `<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="${(k.r * 0.98).toFixed(1)}" fill="${cor(k)}" stroke="${P.ln}" stroke-width="${sw}"/><circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="${Math.min(Math.sqrt(k.S / Math.PI), k.r * 0.7).toFixed(1)}" fill="var(--copper)"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${VW.toFixed(1)} ${VH.toFixed(1)}" role="img" aria-label="Corte da ${t.T.nome} ${W} por ${H} mm com ${t.n} cabos"><defs><pattern id="${pre}-pe" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(45)"><rect width="4" height="4" fill="var(--c-pe)"/><rect width="2" height="4" fill="var(--c-pe2)"/></pattern></defs>${perfil}${cab}</svg>`;

    let d6 = 0; [...G.mot1, ...G.mot3].forEach(it => { if (!it.tab) return; const kva = it.tab[col], cos = it.tab[2], kw = kva * cos; d6 += kw * it.q; lin.push({ it, kva, cos, kw }); });

    r.cvMono = G.mot1.reduce((s, x) => s + (x.cv || 0) * x.q, 0); r.cvTri = G.mot3.reduce((s, x) => s + (x.cv || 0) * x.q, 0); r.cvMax3 = Math.max(0, ...G.mot3.map(x => x.cv || 0)); }
  // d7
  { const lin = []; let d7 = 0;
    const aplica = (g, fds, rot) => { const un = []; G[g].forEach(it => { for (let k = 0; k < it.q; k++) un.push({ it, P: it.kWu }); }); un.sort((a, b) => b.P - a.P); un.forEach((x, k) => { const fd = fds[Math.min(k, fds.length - 1)]; d7 += x.P * fd / 100; lin.push({ rot, desc: x.it.desc, P: x.P, fd, ord: k + 1 }); }); };
    aplica('solda', [100, 70, 40, 30], 'Solda a arco / galvanização'); aplica('soldaR', [100, 60], 'Solda a resistência'); aplica('raiox', [100, 70], 'Raios X');
    r.det.d7 = { lin }; r.d.d7 = d7; r.soldaMax = Math.max(0, ...G.solda.map(x => x.kWu), ...G.soldaR.map(x => x.kWu)); }

  r.FDglobal = r.C > 0 ? r.DkW / r.C : 0;
  enquadrarUC(r, u, E);
  r.status = r.falhas.length ? 'fail' : (r.avisos.length ? 'warn' : 'ok');

}

/* ---------- enquadramento (item 6.5) e padrão de entrada (Tabelas 16 e 21) ---------- */
function enquadrarUC(r, u, E) {
  const ten = ENERGISA_TENSOES[E.tensao] || ENERGISA_TENSOES['220/127'];
  if (!ten.un.includes(E.un)) r.avisos.push(`A ${ENERGISA_UN[E.un] || E.un} não consta da relação de empresas da Tabela ${ten.tab}; confirme a tensão de fornecimento com a distribuidora.`);
  if (r.C > 75 + 1e-9) r.falhas.push(`Carga instalada de ${nfmt(r.C, 2)} kW acima de 75 kW: atendimento em tensão primária, com projeto conforme a NDU 002 (NDU 001, itens 1 e 7).`);
  const tabela = ten.tab === 21 ? CAT_T21 : CAT_T16; r.tabCat = ten.tab;

    tipo = 'M';
    if (r.cvTri > 0) r.falhas.push('Rede monofásica 254/127 V: motores trifásicos não podem ser atendidos — consultar a concessionária.');
    if (r.cvMono > 12 + 1e-9) r.falhas.push(`Motores monofásicos somam ${nfmt(r.cvMono, 2)} cv: o atendimento a 254/127 V não admite motor monofásico acima de 12 cv.`);
    if (r.C > 25 + 1e-9) r.falhas.push(`Carga instalada de ${nfmt(r.C, 2)} kW acima de 25 kW (limite da Tabela 21).`);
  } else {

    const okB = r.C <= 17.7 + 1e-9 && !u.reqTri && r.cvTri === 0 && r.cvMono <= 5 + 1e-9 && r.soldaMax <= 8 + 1e-9;
    tipo = u.ligacao !== 'auto' ? u.ligacao : (okM ? 'M' : (okB ? 'B' : 'T'));
    if (tipo === 'M' && !okM) r.falhas.push('Tipo M (F+N, 127 V) não atende: carga instalada acima de 8,80 kW, motores monofásicos acima de 2 cv, solda acima de 2 kVA ou equipamentos que exigem duas ou três fases.');
    if (tipo === 'B' && !okB) r.falhas.push('Tipo B (2F+N) não atende: carga instalada acima de 17,70 kW, motores trifásicos, motores monofásicos 220 V acima de 5 cv ou solda acima de 8 kW.');
    if (tipo === 'T') {
      if (r.cvMono + r.cvTri > 30 + 1e-9) r.falhas.push(`Motores somam ${nfmt(r.cvMono + r.cvTri, 2)} cv: o tipo T não admite soma das potências dos motores superior a 30 cv.`);
      if (r.cvMax3 > 5 + 1e-9) r.avisos.push('Motores trifásicos acima de 5 cv devem ter partida compensada (estrela-triângulo, série-paralelo, chave compensadora ou eletrônica), conforme a Tabela 15.');
      if (r.D > 81.5 + 1e-9) r.falhas.push(`Demanda de ${nfmt(r.D, 2)} kVA acima de 81,5 kVA (limite da categoria T6): consultar a concessionária (NDU 002 / transformador exclusivo).`);
    }
    if (u.ligacao !== 'auto' && ((u.ligacao === 'B' && okM) || (u.ligacao === 'T' && okB))) r.avisos.push('Ligação acima da exigida pela carga: admitida pela distribuidora com custeio pelo consumidor da diferença do medidor e dos materiais (Tabela 16, nota XIII).');
  }
  r.tipo = tipo;
  const cand = tabela.map(catObj).filter(c => c.cat[0] === tipo);
  const val = cand.length && cand[0].base === 'D' ? r.D : r.C; r.baseVal = val; r.baseTxt = cand.length && cand[0].base === 'D' ? 'demanda calculada (kVA)' : 'carga instalada (kW)';
  const cat = cand.find(c => val <= c.hi + 1e-9) || null;
  r.cat = cat;
  if (!cat) { if (cand.length) r.falhas.push(`${r.baseTxt.charAt(0).toUpperCase() + r.baseTxt.slice(1)} de ${nfmt(val, 2)} acima do limite do tipo ${tipo} (${nfmt(cand[cand.length - 1].hi, 2)}).`); return; }
  // padrão: escolhas de isolação, instalação e ramal de conexão
  const sub = u.instalacaoRamal === 'subterraneo' ? 1 : 0, pick = v => Array.isArray(v) ? v[sub] : v;

  if (isol === 'PVC' && cat.pvcF == null) { isol = 'XLPE'; r.avisos.push(`Categoria ${cat.cat}: isolação PVC não aplicável (N.A. na Tabela ${ten.tab}); adotado cabo com isolação XLPE/HEPR/EPR 90 °C.`); }
  const fF = pick(isol === 'PVC' ? cat.pvcF : cat.xlpeF), fN = pick(isol === 'PVC' ? cat.pvcN : cat.xlpeN);

  const at = cat.aterr === 'F' ? fF : pick(cat.aterr);

    ramalEnt: `cobre 0,6/1 kV, isolação ${isol === 'PVC' ? 'PVC 70 °C' : 'XLPE/HEPR/EPR 90 °C'}, ${u.instalacaoRamal === 'subterraneo' ? 'subterrâneo' : 'embutido'}: fase ${fF} mm² e neutro ${fN} mm²`,

  if (r.Iproj > disjMax + 1e-9) r.avisos.push(`Corrente de demanda ${nfmt(r.Iproj, 1)} A acima do disjuntor da categoria; verifique o enquadramento.`);
}

/* ---------- agrupamentos e edifícios (NDU 003) ---------- */
function f003(t, N) { const rows = (t.f || []).filter(x => +x[0] > 0 && +x[1] > 0).sort((a, b) => a[0] - b[0]); if (!rows.length) return null; const r = rows.find(x => N <= +x[0] + 1e-9); return r ? +r[1] : null; }
function a003(t, A) { const rows = (t.a || []).filter(x => +x[0] > 0 && +x[1] > 0).sort((a, b) => a[0] - b[0]); if (!rows.length) return null; const r = rows.find(x => A <= +x[0] + 1e-9); return r ? +r[1] : null; }
function calcEnergisa(proj) {
  const E = proj.energisa || energisaPadrao(), out = { E, ucs: {}, avisos: [], falhas: [] };
  (E.ucs || []).forEach(u => { out.ucs[u.id] = calcUC(u, E); });
  const R = Object.values(out.ucs);
  if (E.modo === 'agrupamento') {
    if (R.length < 2 || R.length > 3) out.avisos.push('Agrupamento (NDU 003, item 9.3) corresponde a edificações com 2 ou 3 unidades consumidoras; acima disso use "Edifício de múltiplas unidades".');
    out.Dsoma = R.reduce((s, r) => s + r.D, 0);
    out.Dnota = R.reduce((s, r) => s + (r.tipo === 'T' ? r.D : r.C), 0);
    out.Dagr = E.agrupDem === 'nota' ? out.Dnota : out.Dsoma;
    out.Iagr = out.Dagr * 1000 / (Math.sqrt(3) * (E.tensao === '254/127' ? 254 : 220));
    out.avisos.push('Ramal de conexão, ramal de entrada e proteção geral do agrupamento: dimensionar pelas Tabelas 19 e 20 da NDU 003 v8.1 (220/127 V) a partir da demanda total — confira o enquadramento na norma.');
  }
  if (E.modo === 'edificio') {
    const t = E.t003 || {}, cj = (E.conj || []).filter(c => +c.n > 0 && +c.area > 0);
    out.N = cj.reduce((s, c) => s + +c.n, 0);
    out.tabOK = (t.f || []).some(x => +x[1] > 0) && (t.a || []).some(x => +x[1] > 0);
    if (!out.tabOK) out.falhas.push('Tabelas 03 (fator de multiplicação f) e 04 (demanda por apartamento a, em função da área útil) da NDU 003 v8.1 não preenchidas — informe os valores da norma para calcular D1.');
    if (out.tabOK && out.N > 0) {
      if (E.metodo003 === 'conjuntos') {
        if (cj.some(c => +c.n < 4)) out.avisos.push('Cálculo por conjuntos de mesma área: válido apenas se todos os conjuntos tiverem no mínimo 4 apartamentos (NDU 003).');
        out.lin = cj.map(c => { const f = f003(t, +c.n), a = a003(t, +c.area); return { c, f, a, D: f != null && a != null ? f * a : null }; });
        if (out.lin.some(l => l.D == null)) out.falhas.push('Número de apartamentos ou área fora das Tabelas 03/04 informadas.');
        out.D1 = out.lin.reduce((s, l) => s + (l.D || 0), 0);
      } else {
        out.Amed = cj.reduce((s, c) => s + c.n * c.area, 0) / out.N;
        out.f = f003(t, out.N); out.a = a003(t, out.Amed);
        if (out.f == null || out.a == null) out.falhas.push('Número total de apartamentos ou área média fora das Tabelas 03/04 informadas.');
        out.D1 = (out.f || 0) * (out.a || 0);

    } else out.D1 = 0;

  }
  out.status = out.falhas.length || R.some(r => r.status === 'fail') ? 'fail' : (out.avisos.length || R.some(r => r.status === 'warn') ? 'warn' : 'ok');
  return out;
}

/* ---------- importação do levantamento de cargas a partir dos circuitos ---------- */
function cargasDoProjeto(proj, calc) {
  const out = [], ilum = { W: 0, c: [] }, tug = { W: 0, c: [] };
  proj.circuitos.forEach(c => {
    const r = calc.res[c.id], d = (c.desc || '').toLowerCase(), P = Math.round(r.P || 0);
    if (c.tipo === 'dist' || c.tipo === 'controle') return;
    if (c.tipo === 'ilum') { ilum.W += P; ilum.c.push(c.num); return; }
    if (c.tipo === 'motor') { const cv = +c.pot * ({ cv: 1, HP: 1.0139, kW: 1.3596, W: 0.0013596 }[c.unid] || 1); const tri = nFases(c.ligacao) === 3, tab = tri ? T13_MOT3 : T12_MOT1; const k = Object.keys(tab).map(Number).sort((a, b) => a - b).find(x => x + 1e-6 >= cv) ?? Math.max(...Object.keys(tab).map(Number)); out.push({ ...cargaPadrao(tri ? 'mot3' : 'mot1'), desc: `${c.desc} (circ. ${c.num})`, cv: +(+k).toFixed(3) }); return; }
    if (c.tipo === 'tug') { tug.W += P; tug.c.push(c.num); return; }
    let g = 'ilum';
    if (/chuveiro|ducha|torneira|aquecedor de água|boiler|aquecimento de água/.test(d)) g = 'aquec';
    else if (/ar[- ]condicionado|split|\bar cond/.test(d)) g = 'arj';
    else if (/forno|fogão|fogao|cooktop/.test(d)) g = 'fogao';
    else if (/micro-?ondas|lava-?louça|lavadora de louça|secadora|secador de roupa|hidromassagem|banheira/.test(d)) g = 'secad';
    else if (/veículo elétrico|veiculo eletrico|recarga/.test(d)) g = 'simult';
    out.push({ ...cargaPadrao(g), desc: `${c.desc} (circ. ${c.num})`, W: P });
  });
  if (tug.W) out.unshift({ ...cargaPadrao('ilum'), desc: `Tomadas de uso geral (circuitos ${tug.c.join(', ')})`, W: tug.W });
  if (ilum.W) out.unshift({ ...cargaPadrao('ilum'), desc: `Iluminação (circuitos ${ilum.c.join(', ')})`, W: ilum.W });
  return out;
}

function memCircuito(B, c, r, proj, calc, num) {

    ['Local', LOCAIS[c.local] || '—', 'Comprimento', `${f1(r.L)} m`],
    ['Potência', potTxt(c, r), 'Fator de potência', f2(r.fp)]
  ] });

  else if (c.tipo === 'motor') { L.push(`Peixo = ${nfmt(+c.pot, c.pot % 1 ? 2 : 0)} ${c.unid} = ${f1(r.Pmec)} W`); L.push(`P = Peixo / η = ${f1(r.Pmec)} / ${f2(r.eta)} = ${f1(r.P)} W;   S = P / cosφ = ${f1(r.P)} / ${f2(r.fp)} = ${f1(r.S)} VA`); }
  else if (r.potLumi) { L.push(`P = Σ potência das luminárias (cálculo luminotécnico: ${r.potLumi.amb.join(', ')}) = ${f0(r.P)} W`); L.push(`S = P / cosφ = ${f0(r.P)} / ${f2(r.fp)} = ${f1(r.S)} VA`); }

  if (c.tipo === 'motor') { L.push(`In,motor = ${In0} = ${f2(r.Icarga)} A`); L.push(`IB = In,motor × FS = ${f2(r.Icarga)} × ${f2(r.fs)} = ${f2(r.IB)} A`); }
  else L.push(`IB = ${In0} = ${f2(r.IB)} A`);
  B.push({ t: 'eq', lines: L });

  B.push({ t: 'eq', lines: [
    fuse ? `Iz,mín = In × I2f / 1,45 = ${r.In} × ${f2(r.I2f)} / 1,45 = ${f2(r.IzReq)} A` : `Iz,mín = In = ${r.In} A`,
    `Ic,mín = Iz,mín / (fator total${npar ? ' × n' : ''}) = ${f2(r.IzReq)} / (${f3(r.fTot)}${npar ? ` × ${r.nPar}` : ''}) = ${f2(r.IcReq)} A`] });
  if (r.Scap != null) { const ic = capacidade(r.mat, r.isol, r.ref, r.nCarr, c.arranjoF, c.arranjoG, r.Scap).Ic; B.push({ t: 'p', text: `Tabela ${r.tabCap} (${MATERIAL[r.mat]}), ${r.colCap}: menor seção com Ic ≥ ${f2(r.IcReq)} A → **${fS(r.Scap)} mm²** (Ic = ${nfmt(ic, ic % 1 ? 1 : 0)} A).` }); }
  else B.push({ t: 'ver', ok: false, text: 'Nenhuma seção da tabela atende ao critério.' });

  st('Seção mínima (6.2.6.1, Tabela 47)');
  B.push({ t: 'p', text: r.mat === 'Al' ? `Condutor de alumínio: seção mínima de ${fS(r.Smin)} mm² (Tabela 47${P.edificacao === 'comercial' ? ' e 6.2.3.8 — instalação comercial' : ''}).` : `Circuito de ${c.tipo === 'ilum' ? 'iluminação' : (c.tipo === 'controle' ? 'sinalização e controle' : 'força')}: seção mínima de ${fS(r.Smin)} mm² (cobre, instalação fixa com cabos isolados).` });

  st('Queda de tensão (6.2.7)');
  if (r.Sdv != null && r.Scap != null && r.Sdv > Math.max(r.Scap, r.Smin)) { const Sb = Math.max(r.Scap, r.Smin); B.push({ t: 'p', text: `Com ${fS(Sb)} mm² a queda no circuito seria de ${f2(r.dvFn(Sb))} % (acumulada ${f2(r.dvMont + r.dvFn(Sb))} %), acima do limite. O critério exige **${fS(r.Sdv)} mm²**.` }); }
  const z = r.z, Vn = c.ligacao === 'FN' || c.ligacao === 'FFN' ? 'U0' : 'U';
  B.push({ t: 'eq', lines: [
    `R′(${z.th} °C) = ${fR(z.R0)} × [1 + ${nfmt(z.alfa, 5)} × (${z.th} − 20)] = ${fR(z.Rl)} Ω/km   (${fS(r.Sf)} mm², ${MATERIAL[r.mat]} classe ${r.classe})`,
    `R = R′ × (1 + ys + yp) = ${fR(z.Rl)} × (1 + ${f4(z.ys)} + ${f4(z.yp)}) = ${fR(z.R)} Ω/km`,
    `XL = 2π × 60 × [0,05 + 0,2 × ln(2 × ${f1(z.gmd)} / ${f1(z.dc)})] × 10⁻³ = ${f3(z.X)} Ω/km   (condutores ${z.arr})`,
    `cosφ = ${f2(r.cos)};   senφ = ${f2(r.sin)};   L = ${f4(r.L / 1000)} km${npar ? `;   n = ${r.nPar}` : ''}${r.ferro ? `;   fator de eletroduto de aço = ${f2(r.ffe)}` : ''}`,
    `ΔV% = ${nfmt(r.kdv, r.kdv % 1 ? 3 : 0)} × ${f2(r.IB)} × ${f4(r.L / 1000)} × (${fR(z.R)} × ${f2(r.cos)} + ${f3(z.X)} × ${f2(r.sin)})${npar ? ` / ${r.nPar}` : ''} / ${r.Vref} × 100${r.ferro ? ` × ${f2(r.ffe)}` : ''} = ${f2(r.dv)} %   (${Vn} = ${r.Vref} V)`] });
  const mont = r.montFonte === 'alimentador' ? `a montante, alimentador ${r.montCirc}` : 'a montante, informada para o quadro';
  B.push({ t: 'ver', ok: r.dv <= r.limCirc + 1e-9, text: `ΔV do circuito = ${f2(r.dv)} % ≤ ${f2(r.limCirc)} %` });
  B.push({ t: 'ver', ok: r.dvTotal <= r.limTotal + 1e-9, text: `ΔV acumulada = ${f2(r.dvMont)} % (${mont}) + ${f2(r.dv)} % = ${f2(r.dvTotal)} % ≤ ${f2(r.limTotal)} %${r.supLongo > 0 ? ` (limite acrescido de ${f2(r.supLongo)} % — linha de ${f0(r.Lcaminho)} m)` : ''}` });

  st('Curto-circuito (5.3.5)');
  B.push({ t: 'ver', ok: r.icnOk, text: `Icc presumida no quadro ${c.quadro} = ${f1(r.icc)} kA; capacidade de interrupção do dispositivo = ${f1(r.icn)} kA` });
  if (r.cc) {
    B.push({ t: 'eq', lines: [`I²t = ${f0(r.cc.I2t)} A²s   (${r.cc.fonte})`, `k = ${r.k}   (${MATERIAL[r.mat]}, ${ISOL[r.isol]}, ${r.Sf > 300 && r.isol === 'PVC' ? 'acima de 300 mm²' : 'temperatura final ' + r.thetaCC + ' °C'})`, `S ≥ √(I²t) / k${npar ? ' / n' : ''} = √${f0(r.cc.I2t)} / ${r.k}${npar ? ` / ${r.nPar}` : ''} = ${f2(r.cc.Scalc)} mm²   →   seção requerida: ${fS(r.Scc)} mm²`] });
    B.push({ t: 'ver', ok: r.cc.k2S2 + 1e-6 >= r.cc.I2t, text: `k² × S² = ${r.k}² × ${npar ? `(${r.nPar} × ${fS(r.Sf)})` : fS(r.Sf)}² = ${f0(r.cc.k2S2)} A²s ≥ I²t = ${f0(r.cc.I2t)} A²s` });
  } else B.push({ t: 'p', text: 'Verificação da solicitação térmica não realizada (desativada nos parâmetros do projeto).' });

  st(`Proteção contra choques elétricos — seccionamento automático (esquema ${P.aterramento})`);
  if (r.tt) { B.push({ t: 'eq', lines: [`RA × IΔn = ${f1(r.tt.RA)} × ${nfmt(r.idn / 1000, 3)} = ${f2(r.tt.RA * r.idn / 1000)} V`] }); B.push({ t: 'ver', ok: r.drUsado && r.tt.ok, text: `RA × IΔn ≤ 50 V${r.drUsado ? '' : ' — dispositivo DR ausente'}` }); }
  else if (r.tn && r.tn.viaDR) B.push({ t: 'p', text: `Circuito protegido por dispositivo DR com IΔn = ${r.idn} mA, que assegura o seccionamento automático em caso de falta à massa.` });
  else if (r.tn && r.tn.fusivel) B.push({ t: 'p', text: 'Proteção por fusível: o seccionamento deve ser confirmado pela curva tempo × corrente do fabricante, com a corrente de falta Ia ≤ U0 / Zs.' });
  else if (r.tn && r.tn.Ia) {
    const Spe = secaoPE(r.Sf, r.mat), m = r.Sf / Spe;
    B.push({ t: 'eq', lines: [
      `Ia = ${r.tn.mult} × In = ${r.tn.mult} × ${r.In} = ${f0(r.tn.Ia)} A   (limite superior do disparo instantâneo${r.curva ? `, curva ${r.curva}` : ''})`,
      `m = Sf / SPE = ${fS(r.Sf)} / ${fS(Spe)} = ${f2(m)};   ρ = ${nfmt(r.tn.rho, 4)} Ω·mm²/m`,
      `Lmax = 0,8 × ${P.U0} × ${npar ? `${r.nPar} × ` : ''}${fS(r.Sf)} / [${nfmt(r.tn.rho, 4)} × (1 + ${f2(m)}) × ${f0(r.tn.Ia)}] = ${f2(r.tn.Lmax)} m`] });
    if (r.tn.S != null && r.tn.S > Math.max(r.Scap || 0, r.Smin, r.Sdv || 0)) B.push({ t: 'p', text: `O critério de seccionamento exige **${fS(r.tn.S)} mm²** (alternativa: proteger o circuito por dispositivo DR).` });
    B.push({ t: 'ver', ok: r.L <= r.tn.Lmax + 1e-9, text: `L = ${f1(r.L)} m ≤ Lmax = ${f2(r.tn.Lmax)} m` });
  } else B.push({ t: 'p', text: 'Verificação não aplicável — circuito sem condutor de proteção.' });

  st('Proteção complementar por dispositivo DR (5.1.3.2.2)');
  if (r.drExigido) B.push({ t: 'p', text: `Exigido — ${r.drMotivo}.` });
  else B.push({ t: 'p', text: r.drUsado ? 'Não exigido pela norma para este circuito; adotado por decisão de projeto.' : (c.tipo === 'ilum' && c.lumAlta ? 'Não exigido: aparelhos de iluminação instalados a altura igual ou superior a 2,50 m.' : 'Não exigido pela norma para este circuito.') });
  if (r.drUsado) B.push({ t: 'ver', ok: r.drIn != null && (!r.drExigido || r.idn <= 30 || P.aterramento === 'TT'), text: `Adotado ${r.drTipo === 'DDR' ? 'disjuntor diferencial-residual' : 'interruptor diferencial-residual'} ${r.drPolos}P ${r.drIn ?? '—'} A, IΔn = ${r.idn} mA${r.drTipo === 'IDR' ? ` (In,DR ≥ In = ${r.In} A)` : ''}` });
  else if (r.drExigido) B.push({ t: 'ver', ok: false, text: 'Dispositivo DR obrigatório não previsto.' });

  if (r.partida) {
    st('Partida do motor (6.5.1.3)');
    B.push({ t: 'eq', lines: [`Ip = (Ip/In) × In,motor = ${f1(r.partida.ipIn)} × ${f2(r.Icarga)} = ${f2(r.partida.Ip)} A;   cosφp = ${f2(r.partida.cp)}`, `ΔVp acumulada = ${f2(r.partida.dv)} %`] });
    B.push({ t: 'ver', ok: r.partida.dv <= 10 + 1e-9, text: `Queda de tensão durante a partida = ${f2(r.partida.dv)} % ≤ 10 %` });
    if (r.partida.lo != null) B.push({ t: 'ver', ok: r.partida.Ip <= r.partida.lo, text: `Ip = ${f1(r.partida.Ip)} A ≤ limiar inferior de disparo magnético da curva ${r.curva} (${f0(r.partida.lo)} A)` });
  }

  st('Seção adotada e verificação final');
  B.push({ t: 'table', head: ['Critério', 'Seção requerida (mm²)'], widths: [72, 28], align: 'lr', rows: r.reqs.map(q => [q.crit, q.S == null ? 'não atendido' : fS(q.S)]).concat([[`Seção adotada (maior valor)${npar ? ` — ${r.nPar} condutores por fase` : ''}`, fS(r.Sf)]]), lastBold: true });
  B.push({ t: 'eq', lines: [`Iz = ${npar ? `${r.nPar} × ` : ''}Ic × fator total = ${npar ? `${r.nPar} × ` : ''}${nfmt(r.Ic, r.Ic % 1 ? 1 : 0)} × ${f3(r.fTot)} = ${f2(r.Iz)} A   (Tabela ${r.tabCap}, ${fS(r.Sf)} mm²)`] });
  B.push({ t: 'ver', ok: r.IB <= r.In + 1e-9 && r.In <= r.Iz + 1e-9, text: `IB = ${f2(r.IB)} A ≤ In = ${r.In} A ≤ Iz = ${f2(r.Iz)} A` });
  B.push({ t: 'ver', ok: r.I2 <= 1.45 * r.Iz + 1e-9, text: `I2 = ${f2(r.I2)} A ≤ 1,45 × Iz = ${f2(1.45 * r.Iz)} A` });
  const np = [];
  if (r.hasN) np.push(`Neutro: ${r.neutroTxt}.`);
  if (r.SPE) {
    np.push(`Condutor de proteção (Tabela 58): ${r.Sf <= 16 ? 'S ≤ 16 mm² → SPE = S' : (r.Sf <= 35 ? '16 < S ≤ 35 mm² → SPE = 16 mm²' : 'S > 35 mm² → SPE = S/2, na seção padronizada superior')} = ${fS(r.SPEtab)} mm².`);
    if (r.pe) np.push(`Verificação adiabática do PE (6.4.3.1.2, k = ${r.pe.k}): S ≥ √${f0(r.cc.I2t)} / ${r.pe.k}${npar ? ` / ${r.nPar}` : ''} = ${f2(r.pe.Sreq)} mm² → PE adotado ${fS(r.SPE)} mm².`);
  }
  if (np.length) B.push({ t: 'p', text: np.join(' ') });
  const t = r.trecho, kc = r.calha;
  if (kc) B.push({ t: 'p', text: kc.esc ? `Conduto: ${kc.exclusivo ? 'exclusivo do circuito' : `trecho ${kc.key}, compartilhado com os circuitos ${kc.circuitos.filter(x => x.id !== c.id).map(x => x.num).join(', ') || '—'}`} — ${kc.T.nome.toLowerCase()} ${kc.esc.W} × ${kc.esc.H} mm, ocupação ${f1(kc.ocup)} % (ver dimensionamento das eletrocalhas).` : 'Conduto: não foi possível dimensionar a eletrocalha — ver dimensionamento das eletrocalhas.' });
  else if (t) B.push({ t: 'p', text: t.aplica ? (t.esc ? `Eletroduto: ${t.exclusivo ? 'exclusivo do circuito' : `trecho ${t.key}, compartilhado com os circuitos ${t.circuitos.filter(x => x.id !== c.id).map(x => x.num).join(', ') || '—'}`} — ${t.esc.nome} DN ${t.esc.dn} (${t.esc.pol}), ocupação ${f1(t.esc.ocup)} % (ver dimensionamento dos eletrodutos).` : 'Eletroduto: não foi possível dimensionar — ver dimensionamento dos eletrodutos.') : `Eletroduto: não se aplica — ${t.motivo}.` });
  B.push({ t: 'spec', status: r.status, text: `Especificação: ${condutoresTxt(r)} — ${cabosTxt(c)}; ${protecaoTxt(c, r)}${r.drUsado ? '; ' + drTxt(r) : ''}${kc ? (kc.esc ? `; ${kc.T.nome.toLowerCase()} ${kc.esc.W} × ${kc.esc.H} mm` : '') : (t && t.esc ? `; eletroduto DN ${t.esc.dn} (${t.esc.pol})` : '')}.`, label: statusTxt(r.status) });
  if (r.falhas.length || r.avisos.length) B.push({ t: 'list', items: r.falhas.map(x => 'Pendência: ' + x).concat(r.avisos.map(x => 'Observação: ' + x)) });
  if (c.obs) B.push({ t: 'note', text: c.obs });
}

function memTrecho(B, t, num) {
  B.push({ t: 'h2', text: `${num} ${t.nome}${t.exclusivo ? '' : ' — circuitos ' + t.circuitos.map(c => c.num).join(', ')}` });
  if (!t.aplica) { B.push({ t: 'p', text: `Não se aplica: ${t.motivo}.` }); return; }
  B.push({ t: 'table', small: true, head: ['Circuito', 'Condutor / cabo', 'Seção (mm²)', 'Ø externo (mm)', 'Área (mm²)'], widths: [16, 36, 16, 16, 16], align: 'llrrr',
    rows: t.itens.map(k => [k.circ, k.multipolar ? `Cabo multipolar ${k.vias} vias` : ({ F: `Fase ${k.fase}`, N: 'Neutro', PE: 'Proteção (PE)' }[k.func]), fS(k.S), k.d ? f1(k.d) : '—', f1(k.A)]).concat([['Total', `${t.n} condutor(es)/cabo(s)`, '', '', f1(t.A)]]), lastBold: true });
  const ELN = ELETRODUTOS[t.cfg.tipo];
  B.push({ t: 'eq', lines: [`Taxa máxima de ocupação (${t.n} ${t.n === 1 ? 'condutor' : 'condutores'}): ${f0(t.taxa * 100)} %`, `Ai,mín = ${f1(t.A)} / ${f2(t.taxa)} = ${f1(t.Areq)} mm²   →   Di,mín = √(4 × ${f1(t.Areq)} / π) = ${f2(t.diMin)} mm`] });
  if (t.esc) B.push({ t: 'ver', ok: t.falhas.length === 0, text: `Adotado: ${ELN.nome} (${ELN.norma}) DN ${t.esc.dn} (${t.esc.pol}) — Di = ${f1(t.esc.di)} mm; área interna ${f1(t.esc.Ai)} mm²; ocupação ${f1(t.esc.ocup)} %` });
  if (t.cfg.comp > 0) B.push({ t: 'ver', ok: !(t.excesso > 0) || (t.cfg.semCaixa && t.acrescimo), text: `Comprimento entre caixas: ${f1(t.cfg.comp)} m com ${t.cfg.curvas} curva(s) de 90°; limite ${t.base} m − ${3 * t.cfg.curvas} m = ${f1(t.Lim)} m` });
  else B.push({ t: 'note', text: 'Comprimento do trecho entre caixas não informado: verificar no projeto os limites de 6.2.11.1 (15 m internos / 30 m externos, menos 3 m por curva).' });
  t.falhas.concat(t.avisos).forEach(x => B.push({ t: 'note', text: x }));
}

function memQuadro(B, q, proj, calc, num) {
  const R = calc.res, Qd = (proj.quadros || {})[q.q] || {};
  B.push({ t: 'h2', text: `${num} Quadro ${q.q}${Qd.desc ? ' — ' + Qd.desc : ''}` });
  if (!q.cs.length) { B.push({ t: 'p', text: 'Quadro sem circuitos.' }); return; }
  const us = q.usadas;
  const wDesc = 100 - (6 + 11 + 8 + 6 + 8 + 6 + 6 + 9 + us.length * 8);
  B.push({ t: 'table', small: true, head: ['Circ.', 'Descrição', 'Ligação', 'P (W)', 'FP', 'S (VA)', 'FCT', 'FCA', ...us.map(l => `Fase ${l} (VA)`), 'Proteção'], widths: [6, wDesc, 11, 8, 6, 8, 6, 6, ...us.map(() => 8), 9], align: 'lllrrrrr' + us.map(() => 'r').join('') + 'l',
    rows: q.cs.map(c => { const r = R[c.id]; const f = cargaFases(c, r); return [c.num, c.desc || TIPOS[c.tipo], composicao(c), f0(r.P), f2(r.fp), f0(r.S), f2(r.FCT), f2(r.FCA), ...us.map(l => f[l] ? f0(f[l]) : '—'), protecaoCurta(c, r)]; })
      .concat([['Total', '', '', f0(q.cs.reduce((s, c) => s + R[c.id].P, 0)), '', f0(q.cs.reduce((s, c) => s + R[c.id].S, 0)), '', '', ...us.map(l => f0(q.fases[l])), '']]), lastBold: true });
  const d = q.dem;
  const L = [`Carga instalada dos circuitos terminais = ${f0(d.Sterm)} VA (${f0(d.Pterm)} W)`];
  if (d.Sjus > 0) L.push(`Demanda dos quadros alimentados a jusante = ${f0(d.Sjus)} VA`);
  if (d.manual) L.push(`Demanda informada pelo projetista = ${nfmt(d.dm, 2)} kVA = ${f0(d.S)} VA   (substitui o cálculo pelo fator de demanda)`);
  else L.push(`Demanda = FD × ΣS + ΣS jusante = ${f0(d.fd * 100)} % × ${f0(d.Sterm)}${d.Sjus > 0 ? ` + ${f0(d.Sjus)}` : ''} = ${f0(d.S)} VA   (${Math.abs(d.fd - 1) < 1e-9 ? 'fator de demanda de 100 %: toda a carga instalada' : 'fator de demanda adotado pelo projetista'})`);
  const P = proj.params, Id = P.fornecimento === 'trifasico' ? d.S / (Math.sqrt(3) * P.U) : (P.fornecimento === 'bifasico' ? d.S / (2 * P.U0) : d.S / P.U0);
  L.push(`Corrente de demanda = ${f0(d.S)} / ${P.fornecimento === 'trifasico' ? `(√3 × ${P.U})` : (P.fornecimento === 'bifasico' ? `(2 × ${P.U0})` : P.U0)} = ${f1(Id)} A`);
  if (us.length > 1) L.push(`Desequilíbrio = (Smáx − Smín) / Smáx × 100 = ${f1(q.deseq)} %`);
  B.push({ t: 'eq', lines: L });
  if (q.alim) B.push({ t: 'p', text: `Alimentado pelo circuito ${q.alim.num} (quadro ${q.alim.quadro}): ${condutoresTxt(R[q.alim.id])}, ${protecaoTxt(q.alim, R[q.alim.id])}.` });
}

function memCalha(B, t, num) {
  const cfg = t.cfg, rs = cfg.reserva || 0;
  B.push({ t: 'h2', text: `${num} ${t.nome}${t.exclusivo ? '' : ' — circuitos ' + t.circuitos.map(c => c.num).join(', ')}` });
  B.push({ t: 'p', text: `${t.T.nome}; maneira de instalar nº ${[...new Set(t.circuitos.map(c => c.metodo))].join(', ')} da Tabela 33${t.T.aberta ? ' (suporte aberto)' : ' (conduto fechado)'}.${cfg.comp > 0 ? ` Comprimento do trecho: ${f1(+cfg.comp)} m.` : ''}` });
  B.push({ t: 'table', small: true, head: ['Circuito', 'Condutor / cabo', 'Seção (mm²)', 'Ø externo (mm)', 'Área (mm²)', 'Peso (kg/m)'], widths: [14, 32, 13, 14, 13, 14], align: 'llrrrr',
    rows: t.itens.map(k => [k.circ, k.multipolar ? `Cabo multipolar ${k.vias} vias` : ({ F: `Fase ${k.fase}`, N: 'Neutro', PE: 'Proteção (PE)' }[k.func]), fS(k.S), k.d ? f1(k.d) : '—', f1(k.A), f3(k.w)]).concat([['Total', `${t.n} condutor(es)/cabo(s)`, '', f0(t.somaD), f1(t.A), f2(t.peso)]]), lastBold: true });
  const L = [];
  if (cfg.tipo === 'canaleta') L.push(`Seção útil informada = ${cfg.larg} × ${cfg.alt} = ${f0(cfg.larg * cfg.alt)} mm²`);
  else L.push(`Wmín = ΣA × (1 + reserva) / (taxa × H) = ${f1(t.A)} × ${f2(1 + rs / 100)} / (${f2(cfg.taxa / 100)} × ${t.H}) = ${f1(t.A * (1 + rs / 100) / (cfg.taxa / 100 * t.H))} mm`);
  if (t.camadaUnica) L.push(`Camada única: Σd × (1 + reserva) = ${f0(t.somaD)} × ${f2(1 + rs / 100)} = ${f0(t.somaD * (1 + rs / 100))} mm ≤ W`);
  if (t.esc) L.push(`Adotado ${t.esc.W} × ${t.esc.H} mm:  ocupação = ${f1(t.A)} / ${f0(t.esc.Au)} = ${f1(t.ocup)} %  (${f1(t.ocupRes)} % com a reserva de ${f0(rs)} %)`);
  if (t.nSup) L.push(`Suportes: ${f1(+cfg.comp)} m / ${f2(cfg.vao)} m + 1 = ${t.nSup} suportes`);
  B.push({ t: 'eq', lines: L });
  if (t.esc) { const sv = corteCalhaSVG(t, PAL_DOC, 'mk' + safeKey(t.key)), ar = Math.min(1, arDe(sv)); B.push({ t: 'fig', svg: svgDoc(sv, 480, Math.round(480 * ar)), ar, w: ar > 0.75 ? 46 : 80, caption: `Corte esquemático: ${t.T.nome.toLowerCase()} ${t.esc.W} × ${t.esc.H} mm com ${t.n} cabos (fase A preta, B vermelha, C branca, neutro azul, PE verde-amarelo).` }); }
  if (t.esc) B.push({ t: 'ver', ok: t.ocupRes <= cfg.taxa + 1e-6, text: `Ocupação com reserva ${f1(t.ocupRes)} % ≤ taxa máxima adotada ${f0(cfg.taxa)} %` });
  if (t.camadaUnica && t.esc) B.push({ t: 'ver', ok: t.somaD * (1 + rs / 100) <= t.esc.W + 1e-6, text: `Cabos em camada única: ${f0(t.somaD * (1 + rs / 100))} mm ≤ ${t.esc.W} mm` });
  if (cfg.carga) B.push({ t: 'ver', ok: t.peso <= cfg.carga + 1e-9, text: `Peso dos cabos ${f2(t.peso)} kg/m ≤ carga admissível ${f1(cfg.carga)} kg/m (vão de ${f2(cfg.vao)} m)` });
  t.falhas.concat(t.avisos).forEach(x => B.push({ t: 'note', text: x }));

/* ---------- mapa de iluminância (opcionalmente com valores) ---------- */

  let s = `<rect x="${F(-e)}" y="${F(-e)}" width="${F(L + 2 * e)}" height="${F(W + 2 * e)}" fill="${C.parede}" stroke="${C.ink}" stroke-width="${F(fs / 10)}"/><rect x="0" y="0" width="${F(L)}" height="${F(W)}" fill="${C.face}" stroke="${C.ink}" stroke-width="${F(fs / 10)}"/>`;
  xs.slice(1, -1).forEach(x => { s += `<line x1="${F(x)}" y1="0" x2="${F(x)}" y2="${F(W)}" stroke="${C.mut}" stroke-width="${F(fs / 16)}" stroke-dasharray="${F(fs * 0.6)} ${F(fs * 0.3)}"/>`; });
  ys.slice(1, -1).forEach(y => { s += `<line x1="0" y1="${F(y)}" x2="${F(L)}" y2="${F(y)}" stroke="${C.mut}" stroke-width="${F(fs / 16)}" stroke-dasharray="${F(fs * 0.6)} ${F(fs * 0.3)}"/>`; });
  xs.slice(1, -1).forEach(x => ys.slice(1, -1).forEach(y => { s += simboloPlanta(r, x, y, fs, C); }));
  if (ref) s += txt(xs[1] + fs * 1.6, ys[1] - fs * 1.2, ref, { fs: fs * 0.7, cor: C.acc });
  // cadeias de cotas
  const cadeiaH = (y, pts, rotulos) => { let o = `<line x1="${F(pts[0])}" y1="${F(y)}" x2="${F(pts[pts.length - 1])}" y2="${F(y)}" stroke="${C.ink}" stroke-width="${F(fs / 14)}"/>`; pts.forEach(x => { o += `<path d="M${F(x - tk)} ${F(y + tk)}L${F(x + tk)} ${F(y - tk)}M${F(x)} ${F(y - tk * 1.6)}V${F(y + tk * 1.6)}" stroke="${C.ink}" stroke-width="${F(fs / 12)}"/>`; }); rotulos.forEach((t, i) => { const a = pts[i], b = pts[i + 1]; if (b - a >= fs * 2.8 || rotulos.length === 1) o += txt((a + b) / 2, y - fs * 0.45, t); }); return o; };
  const cadeiaV = (x, pts, rotulos) => { let o = `<line x1="${F(x)}" y1="${F(pts[0])}" x2="${F(x)}" y2="${F(pts[pts.length - 1])}" stroke="${C.ink}" stroke-width="${F(fs / 14)}"/>`; pts.forEach(y => { o += `<path d="M${F(x - tk)} ${F(y + tk)}L${F(x + tk)} ${F(y - tk)}M${F(x - tk * 1.6)} ${F(y)}H${F(x + tk * 1.6)}" stroke="${C.ink}" stroke-width="${F(fs / 12)}"/>`; }); rotulos.forEach((t, i) => { const a = pts[i], b = pts[i + 1]; if (b - a >= fs * 2.8 || rotulos.length === 1) o += txt(x - fs * 0.45, (a + b) / 2, t, { rot: true }); }); return o; };
  const seg = p => p.slice(1).map((v, i) => nfmt((v - p[i]) / S, 2));
  const y1 = -e - fs * 2.3, y2 = y1 - fs * 2.3, x1 = -e - fs * 2.3, x2 = x1 - fs * 2.3;
  s += cadeiaH(y1, xs, seg(xs)) + cadeiaH(y2, [0, L], [`${nfmt(r.L, 2)} m`]) + cadeiaV(x1, ys, seg(ys)) + cadeiaV(x2, [0, W], [`${nfmt(r.W, 2)} m`]);
  xs.forEach(x => { s += `<line x1="${F(x)}" y1="${F(-e - fs * 0.3)}" x2="${F(x)}" y2="${F(y1 - fs * 0.3)}" stroke="${C.mut}" stroke-width="${F(fs / 20)}"/>`; });
  ys.forEach(y => { s += `<line x1="${F(-e - fs * 0.3)}" y1="${F(y)}" x2="${F(x1 - fs * 0.3)}" y2="${F(y)}" stroke="${C.mut}" stroke-width="${F(fs / 20)}"/>`; });
  const vx = x2 - fs * 1.2, vy = y2 - fs * 1.2, vw = L + e + fs * 1.2 - vx, vh = W + e + fs * 1.2 - vy;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${F(vx)} ${F(vy)} ${F(vw)} ${F(vh)}" role="img" aria-label="Planta de locação com ${r.N} luminárias e cotas">${s}</svg>`;
}

/* ---------- tipos de luminária usados no projeto (L1, L2, …) ---------- */
function chaveLum(a, r) { const p = r.prod; if (a.prod === 'custom') return `custom|${p.W}|${p.lm}|${r.facho}`; return p.tipo === 'lampada' ? `${a.prod}|${corpoKey(r)}|${r.nLamp}` : a.prod; }
function refsLuminarias(proj, calc) {
  const out = {}, porAmb = {}; let n = 0;
  (proj.lumi || []).forEach(a => { const r = calc.lumi[a.id]; if (!r) return; const k = chaveLum(a, r); if (!out[k]) out[k] = { ref: `L${++n}`, r, qtd: 0, ambs: [], W: 0 }; out[k].qtd += r.N; out[k].W += r.P; out[k].ambs.push(a.nome); porAmb[a.id] = out[k].ref; });
  return { tipos: Object.values(out), porAmb };
}
const nomeLum = r => `${r.prod.fab !== '—' ? r.prod.fab + ' ' : ''}${r.prod.mod}${r.prod.tipo === 'lampada' ? ` em ${r.corpo.nome.split(' (')[0].toLowerCase()}, ${r.nLamp} lâmpada${r.nLamp > 1 ? 's' : ''}` : ''}`;

/* ---------- bloco de cálculo de um ambiente (memória e relatório) ---------- */
function memLumiAmbiente(B, a, r, proj, num, refs) {
  const p = r.prod, ref = refs ? refs.porAmb[a.id] : '';
  const f0 = v => nfmt(v, 0), f1 = v => nfmt(v, 1), f2 = v => nfmt(v, 2), f3 = v => nfmt(v, 3);
  B.push({ t: 'h2', text: `${num} ${a.nome} — ${r.req.n}` });
  B.push({ t: 'kv4', rows: [
    ['Dimensões', `${f2(r.L)} × ${f2(r.W)} m — ${f2(r.A)} m²`, 'Pé-direito', `${f2(+a.pd)} m`],
    ['Plano de trabalho', `${f2(+a.hwp)} m`, 'Suspensão', `${f2(+a.susp || 0)} m`],
    ['Refletâncias', `teto ${f0(a.rc * 100)} % · paredes ${f0(a.rw * 100)} % · piso ${f0(a.rf * 100)} %`, 'Requisito', `Em ${r.Em} lx · UGRL ${r.UGR ?? '—'} · Ra ≥ ${r.Ra}${r.tarefa ? ' · Uo ≥ 0,70' : ''}`],
    ['Luminária', `${ref ? ref + ' — ' : ''}${nomeLum(r)}`, 'Dados', `${f1(r.Wlum)} W · ${f0(r.phi)} lm · Ra ${p.Ra}${r.lor < 1 ? ` · LOR ${f2(r.lor)}` : ''}`]
  ] });
  B.push({ t: 'eq', lines: [
    `hm = pé-direito − suspensão − plano de trabalho = ${f2(+a.pd)} − ${f2(+a.susp || 0)} − ${f2(+a.hwp)} = ${f2(r.hm)} m`,
    `K = L × W / [hm × (L + W)] = ${f2(r.L)} × ${f2(r.W)} / [${f2(r.hm)} × (${f2(r.L)} + ${f2(r.W)})] = ${f2(r.K)}`,
    `UF = ${f3(r.UF)}   (${r.ufFonte}${r.ufFonte.startsWith('calc') ? `; facho ${f0(r.facho)}° → n = ${f2(r.n)}` : ''})`,
    `FM = ${f2(r.FM)}   (${r.fmFonte})`,
    `N = Em × A / (Φ × UF × FM) = ${r.Em} × ${f2(r.A)} / (${f0(r.phi)} × ${f3(r.UF)} × ${f2(r.FM)}) = ${f2(r.Nreq)}   →   adotado ${r.N} (${r.nx} × ${r.ny})`,
    `Eméd = N × Φ × UF × FM / A = ${r.N} × ${f0(r.phi)} × ${f3(r.UF)} × ${f2(r.FM)} / ${f2(r.A)} = ${f0(r.Emed)} lx`,
    `Ponto a ponto (${r.gx} × ${r.gy} pontos): Emín = ${f0(r.Emin)} lx; Eméd = ${f0(r.EmedPP)} lx; Emáx = ${f0(r.Emax)} lx; Uo = ${f2(r.Uo)}`,
    `P = ${r.N} × ${f1(r.Wlum)} = ${f0(r.P)} W;   ${f1(r.dens)} W/m²;   ${f2(r.dens100)} W/m² por 100 lx`] });
  const loc = locacaoSVG(r, ref, true), arL = Math.min(1.25, arDe(loc));
  B.push({ t: 'fig', svg: svgDoc(loc, 480, Math.round(480 * arL)), ar: arL, w: arL > 0.9 ? 74 : 96, caption: `Planta de locação: ${r.N} luminárias${ref ? ' ' + ref : ''} em malha de ${r.nx} × ${r.ny}, espaçamento ${f2(r.Sx)} × ${f2(r.Sy)} m e afastamento das paredes de ${f2(r.Sx / 2)} × ${f2(r.Sy / 2)} m (cotas em metros). Altura de montagem ${f2(r.hLum)} m.` });
  const mapa = plantaSVG(r, true, { valores: true }), arM = Math.min(1.25, arDe(mapa));
  B.push({ t: 'fig', svg: svgDoc(mapa, 480, Math.round(480 * arM)), ar: arM, w: arM > 0.9 ? 66 : 86, caption: `Iluminância mantida no plano de trabalho a ${f2(+a.hwp)} m (lx), cálculo ponto a ponto: Emín ${f0(r.Emin)} lx, Eméd ${f0(r.EmedPP)} lx, Emáx ${f0(r.Emax)} lx. Cores: azul ≤ 0,5 × Em; verde próximo de Em; vermelho ≥ 1,5 × Em.` });
  B.push({ t: 'ver', ok: r.okEm, text: `Eméd = ${f0(r.Emed)} lx ≥ Em = ${r.Em} lx` });
  if (r.tarefa) B.push({ t: 'ver', ok: r.okUo, text: `Uo = ${f2(r.Uo)} ≥ 0,70 (área da tarefa)` });
  B.push({ t: 'ver', ok: r.okRa, text: `Ra ${p.Ra} ≥ ${r.Ra}` });
  B.push({ t: 'ver', ok: r.FM >= 0.7 - 1e-9, text: `FM = ${f2(r.FM)} ≥ 0,70` });
  if (r.UGR != null) B.push(p.ugr != null ? { t: 'ver', ok: p.ugr <= r.UGR, text: `UGR da luminária ${p.ugr} ≤ UGRL ${r.UGR}` } : { t: 'note', text: `UGRL = ${r.UGR}: o índice de ofuscamento da instalação deve ser confirmado pela tabela UGR do fabricante (método tabular CIE 117).` });
  if (r.VAmin != null) B.push({ t: 'note', text: `Para comparação, a NBR 5410 (9.5.2.1.2), como alternativa para locais de habitação, prevê ao menos ${r.VAmin} VA de iluminação para ${f2(r.A)} m²; a carga obtida pela luminotécnica é ${f0(r.VA)} VA.` });
  r.falhas.concat(r.avisos).forEach(x => B.push({ t: 'note', text: x }));
  if (a.obs) B.push({ t: 'note', text: a.obs });
}

/* ---------- relatório de cálculo luminotécnico ---------- */
function construirRelatorioLumi(proj, calc) {
  const I = proj.info, A = proj.lumi || [], R = calc.lumi || {}, B = [];
  const f0 = v => nfmt(v, 0), f1 = v => nfmt(v, 1), f2 = v => nfmt(v, 2);
  const refs = refsLuminarias(proj, calc);
  B.push({ t: 'title', kicker: 'ABNT NBR ISO/CIE 8995-1:2013 — Iluminação de ambientes de trabalho — Parte 1: Interior', text: 'Relatório de cálculo luminotécnico', sub: `Iluminação geral de ${A.length} ambiente${A.length === 1 ? '' : 's'} — método dos lúmens com verificação ponto a ponto` });
  B.push({ t: 'meta', rows: [
    ['Obra', I.obra || '—'], ['Proprietário / cliente', I.cliente || '—'],
    ['Endereço', [I.endereco, I.cidade].filter(Boolean).join(' — ') || '—'],
    ['Responsável técnico', [I.responsavel, I.registro].filter(Boolean).join(' — ') || '—'],
    ['ART / TRT / RRT', I.art || '—'], ['Data / revisão', `${dataCurta(I.data) || '—'} — ${I.revisao || 'R00'}`]
  ] });
  let n = 0; const sec = t => { n++; B.push({ t: 'h1', text: `${n}. ${t}` }); return n; };
  sec('Objetivo');
  if (!A.length) { B.push({ t: 'p', text: 'Nenhum ambiente foi cadastrado na aba Luminotécnica.' }); return B; }
  B.push({ t: 'p', text: `Este relatório apresenta o cálculo da iluminação geral dos ${A.length} ambientes da obra acima identificada: quantidade e disposição das luminárias, iluminância média mantida, uniformidade, potência instalada e verificação dos requisitos da ABNT NBR ISO/CIE 8995-1:2013 (iluminância mantida, uniformidade, reprodução de cor e limite de ofuscamento). As plantas indicam a locação das luminárias com cotas e a distribuição de iluminância no plano de trabalho.` });
  sec('Normas e documentos de referência');
  B.push({ t: 'list', items: [
    'ABNT NBR ISO/CIE 8995-1:2013 — Iluminação de ambientes de trabalho — Parte 1: Interior.',
    'CIE 97:2005 — Maintenance of indoor electric lighting systems (fator de manutenção).',
    'CIE 117:1995 — Discomfort glare in interior lighting (índice UGR).',
    'ABNT NBR 5410:2004 Versão Corrigida:2008 — Instalações elétricas de baixa tensão (9.5.2 — previsão de cargas de iluminação).',
    'Catálogos e fichas técnicas dos fabricantes das luminárias e lâmpadas indicadas.'
  ] });
  const sM = sec('Metodologia e premissas');
  B.push({ t: 'eq', lines: ['hm = pé-direito − suspensão − altura do plano de trabalho', 'K = L × W / [hm × (L + W)]          (índice do local)', 'N = Em × A / (Φ × UF × FM)          Eméd = N × Φ × UF × FM / A', 'FM = LLMF × LSF × LMF × RSMF (CIE 97)          Uo = Emín / Eméd', 'E(P) = Σ I(θ) × cos θ / d² + E refletida;   I(θ) = I0 × cosⁿθ'] });
  B.push({ t: 'list', items: [
    'Iluminância mantida (Em) no plano de trabalho conforme a seção 5 da NBR ISO/CIE 8995-1 para o tipo de ambiente, tarefa ou atividade, ou o valor indicado pelo projetista.',
    'Uniformidade Emín/Eméd ≥ 0,7 na área da tarefa; verificação ponto a ponto em malha no plano de trabalho, excluída uma faixa de até 0,5 m junto às paredes.',
    'Fator de utilização (UF) calculado pelo método da radiosidade em três superfícies (plano de trabalho, paredes e teto), com distribuição de intensidade cosⁿθ obtida da abertura do facho, ou informado pela tabela do fabricante. Trata-se de estimativa: para a emissão final, confirmar com a fotometria (arquivo IES ou LDT) do produto especificado.',
    'Fator de manutenção não inferior a 0,70 (NBR ISO/CIE 8995-1, anexo D), adotado ou calculado pela CIE 97.',
    'Luminárias em malha regular, com espaçamento S entre centros e afastamento S/2 das paredes.',
    'O índice de ofuscamento unificado (UGR) depende da fotometria e não é calculado neste relatório; deve ser confirmado pela tabela UGR do fabricante.'
  ] });
  sec('Luminárias adotadas');
  B.push({ t: 'table', small: true, head: ['Ref.', 'Fabricante', 'Produto', 'P (W)', 'Fluxo (lm)', 'lm/W', 'Ra', 'Qtd.', 'P total (W)'], widths: [6, 12, 40, 7, 9, 7, 5, 6, 8], align: 'lllrrrrrr',
    rows: refs.tipos.map(t => [t.ref, t.r.prod.fab, nomeLum(t.r).replace(t.r.prod.fab + ' ', ''), f1(t.r.Wlum), f0(t.r.phi), f0(t.r.phi / (t.r.Wlum || 1)), String(t.r.prod.Ra), String(t.qtd), f0(t.W)])
      .concat([['Total', '', '', '', '', '', '', String(refs.tipos.reduce((s, t) => s + t.qtd, 0)), f0(refs.tipos.reduce((s, t) => s + t.W, 0))]]), lastBold: true });
  B.push({ t: 'figs', itens: refs.tipos.map(t => ({ svg: svgDoc(desenhoLuminaria(t.r, PAL_DOC)), caption: `${t.ref} — ${nomeLum(t.r)}`, sub: `${f1(t.r.Wlum)} W · ${f0(t.r.phi)} lm · Ra ${t.r.prod.Ra}${dimLum(t.r) ? ' · ' + dimLum(t.r) : ''}${t.r.prod.fonte ? ` · fonte: ${t.r.prod.fonte}` : ''}`, circs: `${t.qtd} unid. — ${t.ambs.join(', ')}`, rot: 'Quantidade: ' })) });
  B.push({ t: 'note', text: 'Desenhos esquemáticos, sem escala, para identificação do tipo de luminária. Dimensões, fotometria e acessórios devem ser confirmados na ficha técnica do produto especificado.' });
  sec('Resumo dos resultados');
  B.push({ t: 'table', small: true, head: ['Ambiente', 'Área (m²)', 'Em (lx)', 'Ref.', 'N', 'Arranjo', 'Eméd (lx)', 'Uo', 'P (W)', 'W/m²', 'Situação'], widths: [22, 8, 7, 6, 5, 8, 8, 6, 7, 7, 16], align: 'lrrlrcrrrrl',
    rows: A.map(a => { const r = R[a.id]; return [a.nome, f2(r.A), String(r.Em), refs.porAmb[a.id], String(r.N), `${r.nx} × ${r.ny}`, f0(r.Emed), f2(r.Uo), f0(r.P), f1(r.dens), statusTxt(r.status)]; })
      .concat([['Total', f2(A.reduce((s, a) => s + R[a.id].A, 0)), '', '', String(A.reduce((s, a) => s + R[a.id].N, 0)), '', '', '', f0(A.reduce((s, a) => s + R[a.id].P, 0)), '', '']]), lastBold: true });
  const sA = sec('Cálculo por ambiente');
  A.forEach((a, i) => memLumiAmbiente(B, a, R[a.id], proj, `${sA}.${i + 1}`, refs));
  sec('Potência de iluminação por circuito');
  const grupos = {}; A.forEach(a => { const k = a.circuito && proj.circuitos.some(c => c.id === a.circuito) ? a.circuito : ''; (grupos[k] = grupos[k] || []).push(a); });
  B.push({ t: 'table', small: true, head: ['Circuito', 'Ambientes', 'Luminárias', 'P (W)', 'Uso no dimensionamento do circuito'], widths: [22, 32, 10, 9, 27], align: 'llrrl',
    rows: Object.entries(grupos).map(([k, as]) => { const c = proj.circuitos.find(x => x.id === k), rc = c ? calc.res[c.id] : null; const P = as.reduce((s, a) => s + R[a.id].P, 0); return [c ? `${c.num} — ${c.desc || 'Iluminação'}` : 'Sem circuito associado', as.map(a => a.nome).join(', '), String(as.reduce((s, a) => s + R[a.id].N, 0)), f0(P), c ? (c.potLumi ? `potência adotada no circuito (${f0(rc.S)} VA, FP ${f2(rc.fp)})` : `circuito com ${f0(rc.S)} VA informados pelo projetista`) : '—']; }) });
  sec('Conclusão');
  const fal = A.filter(a => R[a.id].status === 'fail'), obs = A.filter(a => R[a.id].status === 'warn');
  if (!fal.length) B.push({ t: 'p', text: `Os ${A.length} ambientes calculados atendem à iluminância mantida exigida pela NBR ISO/CIE 8995-1 com as luminárias e o arranjo indicados.${obs.length ? ` Os ambientes ${obs.map(a => a.nome).join(', ')} possuem observações (uniformidade, ofuscamento ou fator de manutenção) a confirmar com a fotometria do produto.` : ''}` });
  else { B.push({ t: 'p', text: `${A.length - fal.length} de ${A.length} ambientes atendem aos requisitos. Pendências:` }); B.push({ t: 'list', items: fal.map(a => `${a.nome} — ${R[a.id].falhas.join(' ')}`) }); }
  B.push({ t: 'p', text: 'Após a instalação, recomenda-se medir a iluminância no plano de trabalho em malha de pontos, com luxímetro calibrado, para confirmar os valores calculados, e manter o plano de manutenção (limpeza e substituição) adotado no fator de manutenção.' });
  B.push({ t: 'sign', place: [I.cidade, dataExtenso(I.data)].filter(Boolean).join(', '), name: I.responsavel || 'Responsável técnico', reg: I.registro || '' });
  return B;
}

/* atraso térmico — ABNT NBR 15220-2 (homogêneo: 0,7284·√(Rt·CT); heterogêneo: 1,382·Rt·√(B1 + B2)) */
function atrasoNBR15220(cons) {
  const cam = (cons.cam || []).map(l => ({ m: MAT_C[l.mat], e: l.e / 100 })).filter(x => x.m);
  if (!cam.length) return 0;
  const Rt = cam.reduce((s, x) => s + (x.m.R != null ? x.m.R : x.e / x.m.lam), 0), CT = cam.reduce((s, x) => s + (x.m.R != null ? 0 : x.e * x.m.rho * x.m.c), 0);
  const mats = cam.filter(x => x.m.R == null);
  if (mats.length === 1 && cam.length === 1) return 0.7284 * Math.sqrt(Rt * CT);
  const ext = cam[0]; if (ext.m.R != null) return 1.382 * Rt * Math.sqrt(0.226 * CT / Rt);
  const Rext = ext.e / ext.m.lam, CText = ext.e * ext.m.rho * ext.m.c;
  const B1 = 0.226 * (CT - CText) / Rt; let B2 = 0.205 * (ext.m.lam * ext.m.rho * ext.m.c / Rt) * (Rext - (Rt - Rext) / 10); if (B2 < 0) B2 = 0;
  return 1.382 * Rt * Math.sqrt(Math.max(0, B1 + B2));
}
function camadasTxt(cons) { return (cons.cam || []).map(l => { const m = MAT_C[l.mat]; return m ? `${m.nome.split(' — ')[0].split(' (')[0].toLowerCase()} ${nfmt(+l.e, l.e % 1 ? 2 : 0)} cm` : ''; }).filter(Boolean).join(' + '); }

    if (r.Ny > 1) g += cotaA(C, x0, y0 - 10, x0 + r.Dx * sc, y0 - 10, `${f2(r.Dx)} m`);

/* corte (vista lateral) com camadas do solo */

  g += `<line x1="0" y1="${y0}" x2="${W}" y2="${y0}" stroke="${C.ink}" stroke-width="1.4"/>` + txtA(C, 8, y0 - (brita ? 14 : 6), 'superfície do solo', { fs: 9, cor: C.mut });

    g += cotaA(C, xs[0] - 22, Y(0), xs[0] - 22, Y(+a.L), `L = ${f2(+a.L)} m`) + txtA(C, xs[0] + 8, Y(+a.L) - 4, `Ø ${nfmt(+a.d, 1)} mm`, { fs: 9, cor: C.mut });

/* curva de resistividade aparente × espaçamento (Wenner) */
function soloSVG(rs, doc = true) {
  const C = corAterr(doc), W = 480, H = 240, ml = 52, mr = 16, mt = 26, mb = 34, pw = W - ml - mr, ph = H - mt - mb;
  const A = rs.porA; if (!A.length) return '';
  const amin = Math.min(...A.map(q => q.a)), amax = Math.max(...A.map(q => q.a)), lmin = Math.log10(amin) - 0.12, lmax = Math.max(Math.log10(amax) + 0.12, lmin + 0.6);
  const vals = [...rs.linhas.map(l => l.rho), ...A.map(q => q.modelo || q.rho), rs.rhoMed], ymax = Math.max(...vals) * 1.12;
  const step = [10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000].find(s => ymax / s <= 6) || 20000;
  const X = a => ml + (Math.log10(a) - lmin) / (lmax - lmin) * pw, Yv = v => mt + ph - v / ymax * ph;
  let g = '';
  for (let v = 0; v <= ymax; v += step) g += `<line x1="${ml}" y1="${Yv(v).toFixed(1)}" x2="${W - mr}" y2="${Yv(v).toFixed(1)}" stroke="${C.grid}"/>` + txtA(C, ml - 5, Yv(v) + 3, nfmt(v, 0), { fs: 9, anc: 'end', cor: C.mut });
  for (let e = Math.floor(lmin); e <= Math.ceil(lmax); e++) for (const m of [1, 2, 5]) { const a = m * 10 ** e; if (Math.log10(a) > lmax + 1e-9 || Math.log10(a) < lmin - 1e-9) continue; g += `<line x1="${X(a).toFixed(1)}" y1="${mt}" x2="${X(a).toFixed(1)}" y2="${mt + ph}" stroke="${C.grid}"/>` + txtA(C, X(a), H - mb + 13, nfmt(a, a < 1 ? 1 : 0), { fs: 9, anc: 'middle', cor: C.mut }); }
  g += `<line x1="${ml}" y1="${mt + ph}" x2="${W - mr}" y2="${mt + ph}" stroke="${C.ink}"/><line x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt + ph}" stroke="${C.ink}"/>`;
  rs.linhas.forEach(l => { g += l.desc ? `<path d="M${X(l.a) - 3} ${Yv(l.rho) - 3} l6 6 M${X(l.a) - 3} ${Yv(l.rho) + 3} l6 -6" stroke="${C.warn}" stroke-width="1.2"/>` : `<circle cx="${X(l.a).toFixed(1)}" cy="${Yv(l.rho).toFixed(1)}" r="2.6" fill="none" stroke="${C.mut}"/>`; });
  g += `<line x1="${ml}" y1="${Yv(rs.rhoMed).toFixed(1)}" x2="${W - mr}" y2="${Yv(rs.rhoMed).toFixed(1)}" stroke="${C.warn}" stroke-width="1.2" stroke-dasharray="6 4"/>`;
  if (rs.m2) { let d = ''; for (let i = 0; i <= 60; i++) { const a = 10 ** (lmin + (lmax - lmin) * i / 60); d += `${i ? 'L' : 'M'}${X(a).toFixed(1)} ${Yv(rhoApar2c(a, rs.m2.rho1, rs.m2.rho2, rs.m2.h)).toFixed(1)} `; } g += `<path d="${d}" fill="none" stroke="${C.acc}" stroke-width="2"/>`; }
  A.forEach(q => { g += `<circle cx="${X(q.a).toFixed(1)}" cy="${Yv(q.rho).toFixed(1)}" r="4" fill="${C.acc}"/>`; });
  const leg = [[C.acc, 'média por espaçamento', 'pt'], ...(rs.m2 ? [[C.acc, 'modelo de duas camadas', 'ln']] : []), [C.warn, `média ${nfmt(rs.rhoMed, 0)} Ω·m`, 'dash']];
  leg.forEach(([c, t, k], i) => { const x = ml + 6 + i * 150; g += (k === 'pt' ? `<circle cx="${x + 6}" cy="12" r="4" fill="${c}"/>` : `<line x1="${x}" y1="12" x2="${x + 14}" y2="12" stroke="${c}" stroke-width="2"${k === 'dash' ? ' stroke-dasharray="5 3"' : ''}/>`) + txtA(C, x + 18, 15, t, { fs: 9 }); });
  g += txtA(C, ml + pw / 2, H - 4, 'espaçamento a (m) — escala logarítmica', { fs: 9, anc: 'middle', cor: C.mut }) + txtA(C, 12, mt + ph / 2, 'ρa (Ω·m)', { fs: 9, anc: 'middle', cor: C.mut, rot: -90 });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva de resistividade aparente do solo"><rect width="${W}" height="${H}" fill="${C.bg}"/>${g}</svg>`;
}

/* ---------- memorial ---------- */
function geomArranjoTxt(a, r) {
  const f2 = v => nfmt(v, 2);
  if (a.tipo === 'haste') return `1 haste de ${f2(+a.L)} m, Ø ${nfmt(+a.d, 1)} mm`;
  if (a.tipo === 'linha') return `${r.nH} hastes de ${f2(+a.L)} m alinhadas, espaçadas de ${f2(+a.e)} m`;

      case 'kv4': return `<table class="d-kv"><tbody>${b.rows.map(r => `<tr><th scope="row">${escH(r[0])}</th><td>${escH(r[1])}</td><th scope="row">${escH(r[2])}</th><td>${escH(r[3])}</td></tr>`).join('')}</tbody></table>`;

  else if (sc === 't003') { const row = PROJ.energisa.t003[box.dataset.tab][+box.dataset.i]; if (row) row[+k] = v; }
  else if (sc === 'amb') { const a = ambSel(); if (!a) return; a[k] = v; struct = efeitosAmbiente(a, k) || struct; }

function metodoCompativel(c) {
  const m = MET[c.metodo];
  if (m && m.tipos.includes(c.tipoCabo)) return;
  const par = MET_PAR[c.metodo];
  c.metodo = (par && MET[par].tipos.includes(c.tipoCabo)) ? par : METODOS.find(x => x.tipos.includes(c.tipoCabo)).id;
}
function efeitosCircuito(c, k) {
  if (k === 'ligacao') {
    const n = nFases(c.ligacao), us = { monofasico: 'A', bifasico: 'AB', trifasico: 'ABC' }[PROJ.params.fornecimento];
    if (n === 1) c.fases = (c.fases && c.fases.length === 1) ? c.fases : 'A';
    else if (n === 2) c.fases = (c.fases && c.fases.length === 2) ? c.fases : 'AB';
    else c.fases = 'ABC';
    if (!us.includes(c.fases[0])) c.fases = n === 1 ? 'A' : 'AB';
    if (c.ligacao !== 'FFFN') { c.neutroReduzido = false; c.harmonicas = false; }

  }
  if (k === 'tipoCabo') { metodoCompativel(c); return true; }

}

  return false;

/* ---------- arquivos ---------- */
async function oferecerArquivo(nome, dados, mime) {
  const dl = await DOWNLOADS;
  if (dl) {
    try { await dl.save({ filename: nome, data: dados }); toast(`${nome} salvo.`); }
    catch (e) { if (e && e.code === 'declined') toast('Download cancelado.'); else toast('Não foi possível salvar o arquivo' + (e && e.message ? `: ${e.message}` : '.')); }
    return;
  }
  const blob = dados instanceof Blob ? dados : new Blob([dados], { type: mime });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  toast(`${nome} gerado.`);
}
function slug() { return (PROJ.info.obra || 'projeto').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase().slice(0, 50) || 'projeto'; }

async function exportar(tipo, bt, doc) {
  const txt = bt.textContent; bt.disabled = true; bt.textContent = 'Gerando…';
  try {
    const { blocos, nome, meta } = tipo === 'xlsx' ? {} : docAtual(doc);
    if (tipo === 'pdf') await oferecerArquivo(nome + '.pdf', await gerarPDF(blocos, meta), 'application/pdf');
    else if (tipo === 'docx') await oferecerArquivo(nome + '.docx', await gerarDOCX(blocos, meta), 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
    else if (tipo === 'xlsx') await oferecerArquivo(`quadro-de-cargas-${slug()}-${(PROJ.info.revisao || 'R00').toLowerCase()}.xlsx`, await gerarXLSX(PROJ, CALC), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    else await oferecerArquivo(nome + '.html', gerarHTMLArquivo(blocos, meta.titulo), 'text/html');
  } catch (e) { console.error(e); toast(e.message || 'Falha ao gerar o arquivo.'); }
  finally { bt.disabled = false; bt.textContent = txt; }
}
function abrirArquivo(file) {

  fr.onload = () => {
    try {
      const p = JSON.parse(fr.result);
      if (!p || !Array.isArray(p.circuitos) || !p.params) throw new Error('formato');
      PROJ = normalizarProjeto(p); PROJ.exemplo = false; SEL = PROJ.circuitos[0]?.id || null; LSEL = PROJ.lumi[0]?.id || null; mudou(true); toast(`Projeto "${PROJ.info.obra || file.name}" aberto.`);
    } catch (e) { toast('Arquivo inválido: use um projeto salvo pelo Dimensiona 5410 (.json).'); }

}

function corteSVG(t, pre) {

      return `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="${p.r.toFixed(2)}" fill="var(--c-capa)" stroke="var(--ink)" stroke-width="${(V / 120).toFixed(3)}"/>${nuc}`;
    }
    return `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="${(p.r * 0.985).toFixed(2)}" fill="${cor(k)}" stroke="var(--ink)" stroke-width="${(V / 140).toFixed(3)}"/><circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="${Math.min(Math.sqrt(k.S / Math.PI), p.r * 0.7).toFixed(2)}" fill="var(--copper)"/>`;
  }).join('');
  return `<svg viewBox="${-V} ${-V} ${2 * V} ${2 * V}" role="img" aria-label="Corte do eletroduto DN ${t.esc.dn} com ${t.n} condutores, ocupação ${nfmt(t.esc.ocup, 1)} %">
    <defs><pattern id="${pre}-pe" patternUnits="userSpaceOnUse" width="${(V / 9).toFixed(2)}" height="${(V / 9).toFixed(2)}" patternTransform="rotate(45)"><rect width="${(V / 9).toFixed(2)}" height="${(V / 9).toFixed(2)}" fill="var(--c-pe)"/><rect width="${(V / 18).toFixed(2)}" height="${(V / 9).toFixed(2)}" fill="var(--c-pe2)"/></pattern></defs>
    <circle r="${(R + wall / 2).toFixed(2)}" fill="var(--sunk)" stroke="var(--line-strong)" stroke-width="${wall.toFixed(2)}"/>${circs}</svg>`;

function empacotar(R, raios) {
  const idx = raios.map((r, i) => ({ r, i })).sort((a, b) => b.r - a.r), pl = [];
  const cabe = (x, y, r) => Math.hypot(x, y) <= R - r + 1e-6 && pl.every(p => Math.hypot(x - p.x, y - p.y) >= p.r + r - 1e-6);
  const inter = (x0, y0, r0, x1, y1, r1) => { const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy); if (!d || d > r0 + r1 + 1e-9 || d < Math.abs(r0 - r1) - 1e-9) return []; const a = (r0 * r0 - r1 * r1 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r0 * r0 - a * a)), xm = x0 + a * dx / d, ym = y0 + a * dy / d; return [[xm + h * dy / d, ym - h * dx / d], [xm - h * dy / d, ym + h * dx / d]]; };

document.addEventListener('input', ev => onCampo(ev, false));

  if (el.dataset.deleq) { const a = ambCSel(); if (a) { a.equip.splice(+el.dataset.deleq, 1); mudou(true); } return; }
